services:
  db:
    image: postgres:16
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp -d sp"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: sp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sp:${POSTGRES_PASSWORD}@db:5432/sp
      APP_URL: https://${DOMAIN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_DAILY_LIMIT_FREE: ${AI_DAILY_LIMIT_FREE:-10}
      AI_DAILY_LIMIT_PREMIUM: ${AI_DAILY_LIMIT_PREMIUM:-100}
      # bez ":" pēc nosaukuma: ja .env ir AI_DAILY_LIMIT_GLOBAL= (tukšs), limita nav; ja nav iestatīts vispār, ir 1500
      AI_DAILY_LIMIT_GLOBAL: ${AI_DAILY_LIMIT_GLOBAL-1500}
      REGISTER_LIMIT_PER_HOUR: ${REGISTER_LIMIT_PER_HOUR:-40}
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-100}
      ROOM_MAX_MEMBERS: ${ROOM_MAX_MEMBERS:-6}
      ROOM_MAX_HOSTED: ${ROOM_MAX_HOSTED:-3}
      ROOMS_PREMIUM_ONLY: ${ROOMS_PREMIUM_ONLY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      AI_PRICE_IN: ${AI_PRICE_IN:-}
      AI_PRICE_OUT: ${AI_PRICE_OUT:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Study Pilot <jautajumi@studypilot.lv>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PREMIUM_PRICE_TEXT: ${PREMIUM_PRICE_TEXT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Datubāzes rezerves kopija reizi dienā mapē ./backups, glabā 7 dienas (skat. scripts/backup.sh)
  backup:
    image: postgres:16
    restart: always
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: sp
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sp
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
