services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: sp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://sp:${POSTGRES_PASSWORD}@db:5432/sp
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_DAILY_LIMIT_FREE: ${AI_DAILY_LIMIT_FREE:-10}
      AI_DAILY_LIMIT_PREMIUM: ${AI_DAILY_LIMIT_PREMIUM:-100}

  # Datubāzes rezerves kopija reizi dienā mapē ./backups, glabā 7 dienas (skat. scripts/backup.sh)
  backup:
    image: postgres:16
    restart: always
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: sp
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sp
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
