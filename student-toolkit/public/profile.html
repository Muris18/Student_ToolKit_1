<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your profile – Student Toolkit</title>
<meta name="description" content="Manage your Student Toolkit profile.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><div class="bar"><a class="logo" href="index.html"><span>Student</span> Toolkit</a><div class="actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark theme">Theme</button><div class="account-area" id="account-area"></div><button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button></div></div><nav class="nav" id="nav" aria-label="Main"><a href="index.html">Home</a><a href="index.html#study">Study</a><a href="index.html#money">Money</a><a href="index.html#progress">Progress</a><a href="index.html#career">Career</a><a href="index.html#tools">Tools</a><a href="index.html#soon">Soon</a><a href="about.html">About</a></nav></div></header>
<main class="wrap tool">
<div id="loading" class="lead">Loading your profile...</div>
<div class="panel auth-panel" id="profile-panel" hidden>
  <h1>Your profile</h1>
  <p class="lead" id="email-line"></p>
  <form id="form" novalidate>
    <div class="field"><label for="name">Display name</label><input id="name" type="text" maxlength="60"></div>
    <div class="field"><label for="bio">About you</label><textarea id="bio" rows="4" maxlength="280" placeholder="Course, year, what you are studying for..."></textarea></div>
    <div class="error" id="error" role="alert"></div>
    <div class="buttons">
      <button class="btn" type="submit" id="submit">Save changes</button>
      <button class="btn ghost" type="button" id="logout">Log out</button>
    </div>
    <p class="hint" id="saved" aria-live="polite"></p>
  </form>
</div>
</main>
<footer class="site-footer"><div class="wrap">Student Toolkit &middot; <a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a></div></footer>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
