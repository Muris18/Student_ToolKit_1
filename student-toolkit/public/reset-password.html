<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password – Student Toolkit</title>
<meta name="description" content="Reset your Student Toolkit password.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><div class="bar"><a class="logo" href="index.html"><span>Student</span> Toolkit</a><div class="actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark theme">Theme</button><div class="account-area" id="account-area"></div><button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button></div></div><nav class="nav" id="nav" aria-label="Main"><a href="index.html">Home</a><a href="index.html#study">Study</a><a href="index.html#money">Money</a><a href="index.html#progress">Progress</a><a href="index.html#career">Career</a><a href="index.html#tools">Tools</a><a href="index.html#soon">Soon</a><a href="about.html">About</a></nav></div></header>
<main class="wrap tool auth">
<div class="panel auth-panel">
  <h1>Reset password</h1>
  <p class="lead" id="lead">Enter your email and we will send you a reset link.</p>
  <form id="request-form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="error" id="error" role="alert"></div>
    <button class="btn" type="submit" id="submit">Send reset link</button>
  </form>
  <form id="update-form" novalidate hidden>
    <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
    <div class="error" id="update-error" role="alert"></div>
    <button class="btn" type="submit" id="update-submit">Set new password</button>
  </form>
  <p class="hint"><a href="signin.html">Back to log in</a></p>
</div>
</main>
<footer class="site-footer"><div class="wrap">Student Toolkit &middot; <a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a></div></footer>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
