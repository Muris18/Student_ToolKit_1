name: CI

# Katram PR un katrai izmaiņai main zarā: uzbūvē lietotni un palaiž testus.
# Testiem tiek palaista pagaidu PostgreSQL 16 (db/init.sql + migrācijas + eksāmenu imports), lai darbotos arī
# datubāzes testi (AI limiti, pieteikšanās, eksāmenu pārbaude). Slepenas vērtības nav vajadzīgas.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Study_Pilot
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/study_pilot
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Study_Pilot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Datubāze (bāzes shēma, migrācijas, eksāmenu imports)
        run: |
          psql -h localhost -U postgres -d study_pilot -v ON_ERROR_STOP=1 -f db/init.sql
          npm run migrate
          npm run import:exams
      - run: npm run build
      - run: npm test
